name: 주간 커뮤니티 모니터링 (아이즈모바일)

on:
  schedule:
    - cron: '0 23 * * 0'   # 일요일 UTC 23:00 = 월요일 KST 08:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # weekly_data.json 커밋을 위해 필요

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install httpx playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 주간 리포트 실행
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO:           ${{ secrets.REPORT_TO }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawl_community.py

      - name: weekly_data.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f weekly_data.json ]; then
            git add weekly_data.json
            echo "Weekly report: $(date)" > .weekly_run
            git add .weekly_run
            git commit -m "chore: weekly data update [$(date +%Y-%m-%d)]" || echo "Nothing to commit"
            git push || echo "Push skipped"
          else
            echo "weekly_data.json 파일이 없습니다"
          fi
