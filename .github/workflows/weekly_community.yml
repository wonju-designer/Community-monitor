name: 주간 커뮤니티 모니터링 (아이즈비전)

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 UTC 00:00 = KST 09:00
  workflow_dispatch:        # 수동 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  community-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4.2.2

      - name: Python 3.11 설정
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install httpx playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 커뮤니티 수집 + 리포트 발송
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO:          ${{ secrets.REPORT_TO }}
        run: python crawl_community.py

      - name: 스케줄 유지용 더미 커밋
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last run: $(date)" > .last_run
          git add .last_run
          git commit -m "chore: keep schedule alive [$(date +%Y-%m-%d)]" || echo "Nothing to commit"
          git push || echo "Push skipped"
