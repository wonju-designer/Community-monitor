name: 주간 커뮤니티 모니터링 (아이즈모바일)

on:
  schedule:
    - cron: '0 23 * * 0'   # 일요일 UTC 23:00 = 월요일 KST 08:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4.2.2

      - name: Python 3.11 설정
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install httpx playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 주간 리포트 실행
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO:             ${{ secrets.REPORT_TO }}
          NAVER_CLIENT_ID:       ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:   ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawl_community.py

      - name: 주차별 데이터 저장
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_data.json 2>/dev/null || true
          echo "Weekly report: $(date)" > .weekly_run
          git add .weekly_run
          git commit -m "chore: weekly report [$(date +%Y-%m-%d)]" || echo "Nothing to commit"
          git push || echo "Push skipped"
